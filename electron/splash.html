<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Segoe UI;
}

body{
  background:
    radial-gradient(
      circle at center,
      #152548,
      #081120
    );
}

.container{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logo{
  width:120px;
  height:120px;

  animation:
    pulse 2s infinite ease-in-out;
}

.title{
  margin-top:24px;

  color:white;

  font-size:38px;
  font-weight:700;

  letter-spacing:4px;
}

.subtitle{
  margin-top:8px;

  color:#87b5ff;

  font-size:13px;

  letter-spacing:2px;
}

.loader{
  margin-top:40px;

  width:260px;
  height:4px;

  overflow:hidden;

  background:
    rgba(255,255,255,.08);

  border-radius:999px;
}

.bar{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #3b82f6,
      #06b6d4
    );

  animation:
    loading 1.8s infinite;
}

.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.dot{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#3b82f6;

  opacity:.45;

  animation:
    float 6s infinite linear;
}

@keyframes pulse{

  0%{
    transform:scale(1);
    filter:drop-shadow(
      0 0 10px #2563eb
    );
  }

  50%{
    transform:scale(1.05);
    filter:drop-shadow(
      0 0 25px #3b82f6
    );
  }

  100%{
    transform:scale(1);
  }
}

@keyframes loading{

  0%{
    width:0%;
  }

  50%{
    width:80%;
  }

  100%{
    width:100%;
  }
}

@keyframes float{

  from{
    transform:
      translateY(100vh);
  }

  to{
    transform:
      translateY(-100px);
  }
}
</style>
</head>

<body>

<div class="particles">
  <span class="dot" style="left:10%"></span>
  <span class="dot" style="left:20%"></span>
  <span class="dot" style="left:35%"></span>
  <span class="dot" style="left:50%"></span>
  <span class="dot" style="left:65%"></span>
  <span class="dot" style="left:80%"></span>
</div>

<div class="container">

  ./assets/G.png

  <div class="title">
    HIVE AI
  </div>

  <div class="subtitle">
    Human Integrated Verification Engine
  </div>

  <div class="loader">
    <div class="bar"></div>
  </div>

</div>

</body>
</html>
