<header
  class="
    app-drag-region
    titlebar
    relative z-50
    flex h-11
    shrink-0
    items-center
    border-b
    px-4
    backdrop-blur-xl
  "
>

  <div class="flex min-w-0 items-center gap-3">

    <div
      class="
        grid
        size-7
        shrink-0
        place-items-center
        rounded
        border
        border-zinc-700
        bg-zinc-800
        text-zinc-400
      "
    >
      <lucide-icon
        [img]="brandIcon"
        [size]="15"
        [strokeWidth]="2"
      />
    </div>

    <div class="flex items-center gap-2.5">
      <span
        class="tb-ink text-xs font-semibold tracking-[0.14em]"
      >
        HIVE<span class="text-zinc-500">.AI</span>
      </span>

      <span
        class="tb-rule hidden h-3.5 w-px sm:block"
      ></span>

      <span
        class="tb-dim hidden text-[11px] md:block"
      >
        Checklist Studio
      </span>
    </div>

  </div>

  <div
    class="
      ml-auto
      flex
      h-full
      items-stretch
    "
  >
    <div
      class="
        app-no-drag
        mr-2
        hidden
        items-center
        lg:flex
      "
    >
      <button
        type="button"
        cdkOverlayOrigin
        #userOrigin="cdkOverlayOrigin"
        (mouseenter)="userTooltipOpen.set(true)"
        (mouseleave)="userTooltipOpen.set(false)"
        class="
          tb-btn
          flex h-8
          items-center
          justify-center
          rounded-full
          border border-zinc-700
          bg-zinc-800
          px-2.5
          transition
        "
        [title]="auth.user()?.name ?? 'Usuario'"
      >
        <lucide-icon
          [img]="userIcon"
          class="h-4 w-4"
        />
      </button>

      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="userOrigin"
        [cdkConnectedOverlayOpen]="userTooltipOpen()"
        [cdkConnectedOverlayPositions]="[
          {
            originX: 'end',
            originY: 'bottom',
            overlayX: 'end',
            overlayY: 'top',
            offsetY: 8
          }
        ]"
      >
        <div
          (mouseenter)="userTooltipOpen.set(true)"
          (mouseleave)="userTooltipOpen.set(false)"
          class="
            w-72
            rounded
            border border-zinc-800
            bg-zinc-950
            p-4
            shadow-2xl shadow-black/20
          "
        >
          @if (auth.loading()) {
            <div class="text-sm text-zinc-500">
              Cargando usuario...
            </div>
          } @else {
            <div class="mb-3 flex items-center gap-3">
              <div
                class="
                  flex size-10
                  items-center
                  justify-center
                  rounded-full
                  border border-blue-500/30
                  bg-blue-500/10
                  text-blue-400
                "
              >
                <lucide-icon
                  [img]="userIcon"
                  class="h-5 w-5"
                />
              </div>

              <div class="min-w-0">
                <p
                  class="
                    truncate
                    text-sm
                    font-semibold
                    text-zinc-100
                  "
                >
                  {{ auth.user()?.name }}
                </p>

                <p
                  class="
                    truncate
                    text-xs
                    text-zinc-500
                  "
                >
                  {{ auth.user()?.email }}
                </p>
              </div>
            </div>

            <div
              class="
                space-y-2
                border-t border-zinc-800
                pt-3
                text-xs
              "
            >
              <div class="flex justify-between">
                <span class="text-zinc-500">
                  Usuario
                </span>

                <span class="text-zinc-200">
                  {{ auth.user()?.username }}
                </span>
              </div>

              <div class="flex justify-between">
                <span class="text-zinc-500">
                  Equipo
                </span>

                <span class="text-zinc-200">
                  {{ auth.user()?.computer }}
                </span>
              </div>

              <div class="flex justify-between">
                <span class="text-zinc-500">
                  Rol
                </span>

                <span class="text-zinc-200">
                  {{ auth.user()?.role }}
                </span>
              </div>
            </div>
          }
        </div>
      </ng-template>
    </div>

    <!-- COPILOT PANEL -->

    <button
      type="button"
      class="
        app-no-drag
        tb-btn
        grid
        w-11
        place-items-center
        transition
      "
      (click)="toggleCopilot()"
      [title]="copilotOpen()
        ? 'Cerrar panel de Copilot'
        : 'Abrir panel de Copilot'"
    >
      <lucide-icon
        [img]="copilotOpen()
          ? copilotCloseIcon
          : copilotOpenIcon"
        [size]="16"
      />
    </button>

    <!-- THEME TOGGLE -->

    <button
      type="button"
      class="
        app-no-drag
        tb-btn
        grid
        w-11
        place-items-center
        transition
      "
      (click)="toggleTheme()"
      [title]="themeService.theme() === 'zinc'
        ? 'Cambiar a tema claro'
        : 'Cambiar a tema oscuro'"
    >
      <lucide-icon
        [img]="themeService.theme() === 'zinc'
          ? moonIcon
          : sunIcon"
        [size]="16"
      />
    </button>

    <!-- MINIMIZE -->

    <button
      type="button"
      class="
        app-no-drag
        tb-btn
        grid
        w-11
        place-items-center
        transition
      "
      (click)="minimize()"
    >
      <lucide-icon
        [img]="minimizeIcon"
        [size]="16"
      />
    </button>

    <!-- MAX -->

    <button
      type="button"
      class="
        app-no-drag
        tb-btn
        grid
        w-11
        place-items-center
        transition
      "
      (click)="toggleMaximize()"
    >
      <lucide-icon
        [img]="
          isMaximized()
            ? restoreIcon
            : maximizeIcon
        "
        [size]="14"
      />
    </button>

    <!-- CLOSE -->

    <button
      type="button"
      class="
        app-no-drag
        tb-btn
        tb-close
        grid
        w-11
        place-items-center
        transition
      "
      (click)="close()"
    >
      <lucide-icon
        [img]="closeIcon"
        [size]="17"
      />
    </button>

  </div>

</header>
